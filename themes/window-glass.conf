# Window Glass: from Windhawk's Windows 11 Taskbar Styler theme "WindowGlass"
# (Glass variant). Taskbar tint is SystemChromeMedium at 0.7, the element radius
# is 12; menus and panels reuse the taskbar's tint, a little more opaque so
# text stays readable.
dark.taskbar=#B31F1F1F
light.taskbar=#B3E6E6E6
dark.surface=#B31F1F1F
light.surface=#B3F3F3F3
dark.popup=#CC202020
light.popup=#CCF9F9F9
dark.backdrop=#8C101010
light.backdrop=#8CECECEC
dark.stroke=#40808080
light.stroke=#40808080
radiusCard=12
radiusOverlay=12

# Layout, from the same theme's README in the three Windhawk styling guides
# (taskbar, start-menu, notification-center: Themes/WindowGlass).
# Taskbar: Height=70, RootGrid Margin 10,2,0,2, CornerRadius=25 (apps and
# tray one pill, Width=Auto: shrunk to its content), TaskListButton
# CornerRadius=10, TaskbarButtonWidth 44, IconSize 30.
taskbar-height=70
taskbar-margin=2
taskbar-radius=25
taskbar-fit=1
taskbar-button-width=44
taskbar-button-radius=10
taskbar-icon-size=30
# Start menu: panels Width=650, CornerRadius=35.
startmenu-width=650
startmenu-radius=35
# Action Center (quick settings): CornerRadius=20, toggles CR2=14.
quicksettings-radius=20
quicksettings-tile-radius=14
# Notification Center: CornerRadius=20, list items CR3=12.
notifications-radius=20
notifications-card-radius=12
