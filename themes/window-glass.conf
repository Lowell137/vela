# Window Glass: from Windhawk's WindowGlass theme (Glass variant). The tint
# is SystemChromeMedium at 0.7, the element radius 12; menus and panels a
# little more opaque so text stays readable.
dark.surface=#B31F1F1F
light.surface=#B3F3F3F3
dark.popup=#CC202020
light.popup=#CCF9F9F9
dark.backdrop=#8C101010
light.backdrop=#8CECECEC
dark.stroke=#40808080
light.stroke=#40808080
radiusCard=12
radiusOverlay=12

# Layout, following lowell's reference screenshots of WindowGlass on Windows
# (2026-10-20): glass windows (the window background see-through: blurred
# when Settings > Window blur is on) and rounded glass panels. Radii from the
# theme's READMEs. No taskbar values: the taskbar's look is chosen on its own.
dark.background=#991C1C1E
light.background=#B3F3F3F3
# Start menu: panels Width=650, CornerRadius=35.
startmenu-width=650
startmenu-radius=35
# Action Center (quick settings): CornerRadius=20, toggles rounder (CR2=14
# in the README; the reference shows bigger tiles).
quicksettings-radius=20
quicksettings-tile-radius=16
# Notification Center: CornerRadius=20, list items CR3=12.
notifications-radius=20
notifications-card-radius=12
# The reference's quick settings: split tiles as two separate buttons, a thick
# volume slider, what plays now on its own card below the panel.
quicksettings-split-gap=4
quicksettings-thick-slider=1
quicksettings-media-card=1
# The reference's calendar card: a big clock with seconds, the weekdays on a
# strip, today a rounded square, a focus timer at the bottom.
notifications-clock=1
notifications-week-strip=1
notifications-today-radius=8
notifications-focus=1
