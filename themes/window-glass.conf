# Window Glass: from Windhawk's WindowGlass theme (Glass variant). The tint
# is SystemChromeMedium at 0.7, the element radius 12; menus a little
# more opaque so text stays readable. Panels: the compositor's acrylic
# alone, like lowell's Windows 11 notification center (2026-10-23).
dark.popup=#B3202020
light.popup=#B3F9F9F9
dark.backdrop=#66101010
light.backdrop=#8CECECEC
dark.stroke=#40808080
light.stroke=#40808080
radiusCard=12
radiusOverlay=12

# Glass windows, following lowell's reference screenshots of WindowGlass on
# Windows (2026-10-20): the window background see-through (blurred when
# Settings > Window blur is on). The surfaces' layouts are styles of their
# own (taskbar/, startmenu/, notifications/window-glass.conf).
dark.background=#991C1C1E
light.background=#B3F3F3F3
# Windhawk's WindowGlass look: a strong acrylic blur.
blur-strength=3.2
