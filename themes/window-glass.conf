# Window Glass: from Windhawk's Windows 11 Taskbar Styler theme "WindowGlass"
# (Glass variant). Taskbar tint is SystemChromeMedium at 0.7, the element radius
# is 12. The rounded floating taskbar of the original is not part of this
# file (a layout, not a value); menus and panels reuse the taskbar's tint,
# a little more opaque so text stays readable.
dark.taskbar=#B31F1F1F
light.taskbar=#B3E6E6E6
dark.surface=#B31F1F1F
light.surface=#B3F3F3F3
dark.popup=#CC202020
light.popup=#CCF9F9F9
dark.backdrop=#8C101010
light.backdrop=#8CECECEC
dark.stroke=#40808080
light.stroke=#40808080
radiusCard=12
radiusOverlay=12
