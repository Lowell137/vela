# Aero: Windows 7's glass on the quick settings and the notification center:
# glass panels with small corners, over a clear blur (no gray
# wash). Pair it with the taskbar style "aero" and the Start menu style "aero".
quicksettings-radius=8
quicksettings-tile-radius=4
notifications-radius=8
notifications-card-radius=4
blur-saturation=1.7
blur-strength=2.0
blur-luminosity=0
blur-tint=0
# Windows 7's glass: lit panel, white line inside a dark edge, the streaks of
# light if the pictures are installed (themes/assets/aero/).
notifications-glass=1
notifications-reflection=asset:aero/AeroPeek.png
notifications-reflection-opacity=0.3
