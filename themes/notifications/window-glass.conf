# Window Glass: Windhawk's Windows 11 Notification Center Styler theme
# "WindowGlass" (Themes/WindowGlass/README.md), with lowell's reference
# screenshots (2026-10-20).
# Action Center (quick settings): CornerRadius=20, toggles rounder (CR2=14
# in the README; the reference shows bigger tiles).
quicksettings-radius=20
quicksettings-tile-radius=16
# Notification Center: CornerRadius=20, list items CR3=12.
notifications-radius=20
notifications-card-radius=12
# The reference's quick settings: split tiles as two separate buttons, a thick
# volume slider, what plays now on its own card below the panel.
quicksettings-split-gap=4
quicksettings-thick-slider=1
quicksettings-media-card=1
# The reference's calendar card: a big clock with seconds, the weekdays on a
# strip, today a rounded square, a focus timer at the bottom.
notifications-clock=1
notifications-week-strip=1
notifications-today-radius=8
notifications-focus=1
