# Liquid Glass: from Windhawk's Windows 11 Taskbar Styler theme "LiquidGlass"
# (the 2nd one). Taskbar tint #14090909 (about 8%), light top edge #69E0E0E0,
# tray pill tint #39101010; its corners are about 34 (taskbar) and 31 (tray).
# Panels and menus take the tray pill's tint, more opaque than the original so
# text stays readable, and rounder corners. The taskbar's own shape and glow
# layer are not part of this file.
dark.taskbar=#14090909
light.taskbar=#14F5F5F5
dark.surface=#99101010
light.surface=#99F5F5F5
dark.popup=#B3101010
light.popup=#B3F9F9F9
dark.backdrop=#66080808
light.backdrop=#66EEEEEE
stroke=#69E0E0E0
cardStroke=#40E0E0E0
radius=8
radiusCard=16
radiusOverlay=24
