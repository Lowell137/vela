# Taskbar XII: Windhawk taskbar styler theme "TaskbarXII" (Themes/TaskbarXII).
# Frame Width=Auto, bar height 48, CornerRadius 4, tray its own pill (SystemChromeAltHigh
# at 0.6, Margin 2). Frame height 56 gives a gap below (margin 4).
dark.taskbar=#99000000
light.taskbar=#99FFFFFF
taskbar-height=48
taskbar-margin=4
taskbar-radius=4
taskbar-fit=1
taskbar-split-gap=2
taskbar-split-radius=4
