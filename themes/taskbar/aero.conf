# Aero: Windows 7's taskbar in bright glass: the orb, glossy buttons, a
# translucent sky-blue bar with a white edge. Based on Windhawk's "Windows7"
# taskbar styler theme (Themes/Windows7).
taskbar-height=40
taskbar-align-left=1
taskbar-weather=0
taskbar-start-glyph=1
taskbar-spacing=2
taskbar-button-width=54
taskbar-button-height=38
taskbar-button-radius=3
taskbar-icon-size=28
taskbar-button-gloss=1
taskbar-button-fill=#668EB8E8
taskbar-button-fill-active=#B3C7DDF5
taskbar-button-stroke=#CCFFFFFF
dark.taskbar=#9A6B9AD0
light.taskbar=#9A8CB6E6
taskbar-stroke=#B3FFFFFF
