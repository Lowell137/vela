# The portals for apps inside Vela (file chooser, open with, settings, screen
# sharing). KDE's work outside Plasma; screenshots and screen sharing go
# through xdg-desktop-portal-wlr, which uses the standard capture protocols
# Vela supports. The file chooser is Vela's own, the Explorer in a file
# chooser's shape (shell/src/filechooser.h): the shell and Settings open it
# through the portal too (common/portaldialogs.h); KDE's and GTK's stay as
# the fallback.
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.FileChooser=vela;kde;gtk
# Global shortcuts for apps: the shell answers (shell/src/globalshortcuts.h).
org.freedesktop.impl.portal.GlobalShortcuts=vela
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
